# Builds the Windows and macOS installers. Pushing a tag like v0.1.0 also
# attaches them to a draft GitHub release; running it by hand only builds
# and keeps the installers as workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: target/release/bundle/nsis/*.exe
          - platform: macos-latest
            bundles: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Build (and draft a release for tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Aonin ${{ github.ref_name }}
          releaseBody: See the README for what's new and how to install.
          releaseDraft: true

      - name: Keep the installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: aonin-${{ matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
