# Builds the Windows and macOS installers. Pushing a tag like v0.1.0 also
# attaches them to a draft GitHub release; running it by hand only builds
# and keeps the installers as workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: target/release/bundle/nsis/*.exe
          - platform: macos-latest
            bundles: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app

      - name: Build (and draft a release for tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files that installed copies download.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing and notarization, once there is an Apple Developer ID:
          # add repository secrets APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
          # APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID,
          # and pass each here as  NAME: ${{ secrets.NAME }}. Left out until then,
          # because empty values would make the bundler attempt to sign.
        with:
          projectPath: app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Aonin ${{ github.ref_name }}
          releaseBody: See the README for what's new and how to install.
          releaseDraft: true
          # latest.json tells installed copies where the new version is.
          includeUpdaterJson: true

      - name: Keep the installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: aonin-${{ matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
