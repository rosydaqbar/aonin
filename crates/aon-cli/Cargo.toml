[package]
name = "aon-cli"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "aon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aon = { version = "0.1.0", path = "../aon" }
aon-core = { version = "0.1.0", path = "../aon-core" }
aon-pro = { version = "0.1.0", path = "../aon-pro" }
clap = { version = "4.6.7", features = ["derive"] }
gethostname = "1.1.0"
