[package]
name = "aon"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
aon-core = { version = "0.1.0", path = "../aon-core" }
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
gethostname = "1.1.0"
if-addrs = "0.15.0"
opus = "0.4.0"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
windows-core = "0.62"
