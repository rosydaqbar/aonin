<!doctype html>
<!--
  Source of docs/images/how-it-works.png and .webp. Everything is one inline
  SVG; render(t) draws the moving parts for loop position t in [0, 1).
  Rebuild with docs/images/src/render.cjs.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Hanken Grotesk';
    src: url('../../../app/node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
  }
  html, body { margin: 0; background: #ebebea; }
  svg { display: block; font-family: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif; }
  .t-title { font-size: 46px; font-weight: 800; fill: #222; letter-spacing: -0.01em; }
  .t-sub { font-size: 21px; fill: #646462; }
  .t-name { font-size: 18px; font-weight: 700; fill: #222; }
  .t-label { font-size: 13px; fill: #646462; letter-spacing: 0.03em; }
  .t-small { font-size: 12px; fill: #646462; letter-spacing: 0.03em; }
  .t-strip { font-size: 17px; font-weight: 700; fill: #ebebea; }
  .t-strip2 { font-size: 13px; fill: #a6a6a4; letter-spacing: 0.03em; }
  .t-chip { font-size: 12px; fill: #ebebea; letter-spacing: 0.03em; }
  .t-chip-off { font-size: 12px; fill: #646462; letter-spacing: 0.03em; }
  .t-code { font-family: Consolas, 'SF Mono', Menlo, monospace; font-weight: 700; letter-spacing: 0.14em; fill: #222; }
  .t-feat { font-size: 19px; font-weight: 700; fill: #222; }
  .t-body { font-size: 15px; fill: #4a4a48; }
  .t-net { font-size: 16px; font-weight: 700; fill: #222; }
  .t-num { font-size: 14px; fill: #222; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#141414" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#141414" flood-opacity="0.08"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d5d5d3"/>
    </pattern>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a39"/><stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#ebebea"/>
  <!-- the network floor between the devices -->
  <rect x="540" y="180" width="440" height="500" rx="24" fill="url(#dots)"/>

  <!-- header -->
  <text x="80" y="104" class="t-title">Aonin</text>
  <text x="80" y="142" class="t-sub">Hear every computer on your desk through one pair of headphones.</text>
  <g transform="translate(1520 96)">
    <rect x="-372" y="-22" width="372" height="40" rx="20" fill="#f6f6f5" stroke="#d5d5d3"/>
    <circle cx="-350" cy="-2" r="5" fill="#5e8a2f"/>
    <text x="-334" y="3" class="t-label" style="fill:#222">Local network only · no server · no account</text>
  </g>

  <!-- audio senders -->
  <g id="senders"></g>
  <!-- paths and packets -->
  <g id="paths"></g>
  <g id="packets"></g>

  <!-- network labels -->
  <g transform="translate(760 214)">
    <text text-anchor="middle" class="t-net">Your Wi-Fi or Ethernet</text>
    <text y="22" text-anchor="middle" class="t-label">UDP, straight from device to device</text>
  </g>
  <!-- a lost packet, rebuilt from the next one -->
  <g id="lostmark">
    <circle r="13" fill="#f0dedb" stroke="#c0352b" stroke-width="1.5"/>
    <path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#c0352b" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(652 352)">
    <rect x="-104" y="-18" width="208" height="52" rx="10" fill="#f6f6f5" stroke="#d5d5d3"/>
    <text text-anchor="middle" y="3" class="t-small" style="fill:#222;font-weight:700">Lost on Wi-Fi?</text>
    <text text-anchor="middle" y="21" class="t-small">Rebuilt from the next packet</text>
  </g>
  <path id="lostlead" d="" stroke="#bbbbb9" stroke-width="1.5" fill="none"/>
  <!-- packet legend -->
  <g transform="translate(760 628)">
    <rect x="-168" y="-24" width="336" height="64" rx="12" fill="#f6f6f5" stroke="#d5d5d3"/>
    <g transform="translate(-146 -6)">
      <rect width="22" height="14" rx="3" fill="#e8601c"/>
      <rect x="23" width="16" height="14" rx="3" fill="#e8601c" opacity="0.35"/>
    </g>
    <text x="-96" y="5" class="t-small" style="fill:#222;font-weight:700">One packet = 2 ms of audio</text>
    <text x="-96" y="24" class="t-small">plus a copy of the 2 ms before it</text>
  </g>

  <!-- the listener -->
  <g id="listener"></g>
  <!-- cable and headphones -->
  <g id="phones"></g>

  <!-- what makes it work -->
  <g id="features"></g>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const C = { housing: '#ebebea', raised: '#f6f6f5', recess: '#e1e1df', line: '#d5d5d3', strong: '#bbbbb9', ink: '#222', ink2: '#646462', strip: '#2a2a2a', orange: '#e8601c', green: '#5e8a2f', hole: '#c9c9c7' };

// ---- device drawings ----
function macbook(g, x, y) {
  el('rect', { x: x + 8, y, width: 96, height: 62, rx: 6, fill: C.strip }, g);
  el('rect', { x: x + 12, y: y + 4, width: 88, height: 52, rx: 3, fill: 'url(#screen)' }, g);
  // a waveform on screen
  const w = el('path', { d: '', stroke: C.orange, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round', class: 'onscreen' }, g);
  w.dataset.x = x + 18; w.dataset.y = y + 30; w.dataset.w = 76;
  el('path', { d: `M${x} ${y + 64} h112 l-6 8 h-100 z`, fill: C.strong }, g);
  el('rect', { x: x + 46, y: y + 64, width: 20, height: 3, rx: 1.5, fill: '#a6a6a4' }, g);
}
function winlaptop(g, x, y) {
  el('rect', { x: x + 8, y, width: 96, height: 62, rx: 4, fill: C.strip }, g);
  el('rect', { x: x + 12, y: y + 4, width: 88, height: 52, rx: 2, fill: '#33536e' }, g);
  // a media player window
  el('rect', { x: x + 22, y: y + 12, width: 68, height: 36, rx: 3, fill: '#f6f6f5' }, g);
  el('rect', { x: x + 22, y: y + 12, width: 68, height: 7, rx: 3, fill: '#d5d5d3' }, g);
  el('path', { d: `M${x + 30} ${y + 27} l8 5 l-8 5 z`, fill: C.ink }, g);
  el('rect', { x: x + 44, y: y + 31, width: 38, height: 3, rx: 1.5, fill: C.line }, g);
  el('rect', { x: x + 44, y: y + 31, width: 22, height: 3, rx: 1.5, fill: C.orange, class: 'progress' }, g);
  el('rect', { x: x + 2, y: y + 62, width: 108, height: 9, rx: 3, fill: C.strong }, g);
}
function desktop(g, x, y, dark) {
  el('rect', { x: x + 4, y: y - 4, width: 104, height: 66, rx: 5, fill: C.strip }, g);
  el('rect', { x: x + 8, y, width: 96, height: 56, rx: 2, fill: dark ? 'url(#screen)' : '#3c3c3b' }, g);
  el('rect', { x: x + 50, y: y + 62, width: 12, height: 8, fill: C.strong }, g);
  el('rect', { x: x + 34, y: y + 70, width: 44, height: 4, rx: 2, fill: C.strong }, g);
}
function grille(g, x, y, n, id, size = 5, gap = 4) {
  const grp = el('g', { class: 'grille', 'data-id': id }, g);
  for (let i = 0; i < n; i++) el('circle', { cx: x + i * (size * 2 + gap - 4) + size, cy: y, r: size / 2 + 0.6, fill: C.hole }, grp);
  return grp;
}

// ---- senders ----
const senders = [
  { name: 'Studio MacBook Pro', os: 'macOS', draw: macbook, chips: [['System audio', true], ['Mic', true]], y: 190 },
  { name: 'Work Laptop', os: 'Windows', draw: winlaptop, chips: [['System audio', true], ['Mic', false]], y: 350 },
  { name: 'Office MacBook', os: 'macOS', draw: macbook, chips: [['System audio', true], ['Mic', false]], y: 510 },
];
const S = document.getElementById('senders');
senders.forEach((s, i) => {
  const g = el('g', { filter: 'url(#lift)' }, S);
  el('rect', { x: 80, y: s.y, width: 440, height: 140, rx: 16, fill: C.raised, stroke: C.line }, g);
  const d = el('g', {}, S);
  s.draw(d, 104, s.y + 30);
  el('text', { x: 246, y: s.y + 42, class: 't-name' }, S, s.name);
  el('text', { x: 246, y: s.y + 63, class: 't-label' }, S, `Audio sender · ${s.os}`);
  let cx = 246;
  for (const [label, on] of s.chips) {
    const w = label.length * 7 + 26;
    el('rect', { x: cx, y: s.y + 78, width: w, height: 24, rx: 12, fill: on ? C.strip : C.raised, stroke: on ? C.strip : C.strong }, S);
    el('text', { x: cx + w / 2, y: s.y + 94, 'text-anchor': 'middle', class: on ? 't-chip' : 't-chip-off' }, S, on ? label : `${label} off`);
    cx += w + 8;
  }
  grille(S, 246, s.y + 120, 14, `s${i}`, 6, 5);
  el('text', { x: 498, y: s.y + 124, 'text-anchor': 'end', class: 't-small' }, S, 'Sending');
  // output port
  el('circle', { cx: 520, cy: s.y + 70, r: 6, fill: C.raised, stroke: C.strong, 'stroke-width': 1.5 }, S);
});

// ---- listener card ----
const L = document.getElementById('listener');
const LX = 1000, LY = 196, LW = 400, LH = 410;
{
  const g = el('g', { filter: 'url(#lift)' }, L);
  el('rect', { x: LX, y: LY, width: LW, height: LH, rx: 16, fill: C.housing, stroke: C.line }, g);
  // strip
  el('path', { d: `M${LX} ${LY + 16} a16 16 0 0 1 16 -16 h${LW - 32} a16 16 0 0 1 16 16 v40 h-${LW} z`, fill: C.strip }, L);
  el('text', { x: LX + 20, y: LY + 35, class: 't-strip' }, L, 'Studio PC');
  el('circle', { cx: LX + 236, cy: LY + 30, r: 5, fill: C.orange }, L);
  el('text', { x: LX + 248, y: LY + 35, class: 't-strip2' }, L, 'Listening');
  el('rect', { x: LX + 322, y: LY + 17, width: 60, height: 26, rx: 13, fill: 'none', stroke: '#a6a6a4' }, L);
  el('text', { x: LX + 352, y: LY + 34, 'text-anchor': 'middle', class: 't-strip2', style: 'fill:#ebebea' }, L, 'Stop');
  // private row
  el('rect', { x: LX, y: LY + 56, width: LW, height: 46, fill: C.recess }, L);
  el('line', { x1: LX, x2: LX + LW, y1: LY + 102, y2: LY + 102, stroke: C.line }, L);
  lock(L, LX + 20, LY + 70, C.ink2);
  el('text', { x: LX + 44, y: LY + 84, class: 't-label', style: 'fill:#222;font-weight:700' }, L, 'Private');
  el('rect', { x: LX + 112, y: LY + 66, width: 104, height: 26, rx: 6, fill: C.raised, stroke: C.strong }, L);
  el('text', { x: LX + 164, y: LY + 84, 'text-anchor': 'middle', class: 't-code', style: 'font-size:14px' }, L, 'K7Q 4MZ');
  el('text', { x: LX + LW - 20, y: LY + 84, 'text-anchor': 'end', class: 't-label' }, L, 'Make public');
  // section header
  el('text', { x: LX + 20, y: LY + 130, class: 't-small' }, L, 'Audio senders');
  el('text', { x: LX + LW - 20, y: LY + 130, 'text-anchor': 'end', class: 't-small' }, L, 'To Speakers (USB DAC)');
  const rows = [['Studio MacBook Pro', '21.8 ms', 0.72], ['Work Laptop', '18.0 ms', 0.8], ['Office MacBook', '24.1 ms', 0.55]];
  rows.forEach(([name, ms, vol], i) => {
    const y = LY + 142 + i * 62;
    el('line', { x1: LX + 20, x2: LX + LW - 20, y1: y + 62, y2: y + 62, stroke: C.line }, L);
    el('circle', { cx: LX + 24, cy: y + 22, r: 4.5, fill: C.green }, L);
    el('text', { x: LX + 38, y: y + 27, class: 't-name', style: 'font-size:15px' }, L, name);
    el('text', { x: LX + 38, y: y + 47, class: 't-small' }, L, ms);
    grille(L, LX + 206, y + 22, 9, `l${i}`, 5, 4);
    // volume
    const sx = LX + 206, sw = 150;
    el('rect', { x: sx, y: y + 42, width: sw, height: 4, rx: 2, fill: C.line }, L);
    el('rect', { x: sx, y: y + 42, width: sw * vol, height: 4, rx: 2, fill: C.strip }, L);
    el('circle', { cx: sx + sw * vol, cy: y + 44, r: 7, fill: C.raised, stroke: C.strong }, L);
    // input port
    el('circle', { cx: LX, cy: y + 30, r: 6, fill: C.raised, stroke: C.strong, 'stroke-width': 1.5 }, L);
  });
  // the mix
  const my = LY + 142 + 3 * 62 + 18;
  el('text', { x: LX + 20, y: my + 12, class: 't-small', style: 'fill:#222;font-weight:700' }, L, 'Mix');
  grille(L, LX + 62, my + 8, 22, 'mix', 6, 5);
  el('text', { x: LX + 20, y: my + 38, class: 't-small' }, L, 'Everyone together, about 20 ms behind real time');
}

function lock(g, x, y, color) {
  el('rect', { x, y: y + 6, width: 14, height: 11, rx: 2.5, fill: 'none', stroke: color, 'stroke-width': 1.75 }, g);
  el('path', { d: `M${x + 3.5} ${y + 6} v-3 a3.5 3.5 0 0 1 7 0 v3`, fill: 'none', stroke: color, 'stroke-width': 1.75 }, g);
}

// ---- cable and headphones ----
const P = document.getElementById('phones');
{
  // The mix leaves from the listener itself (its strip), not from a sender row.
  const ox = LX + LW, oy = LY + 28;
  el('circle', { cx: ox, cy: oy, r: 6, fill: C.raised, stroke: C.strong, 'stroke-width': 1.5 }, P);
  el('path', { d: `M${ox + 6} ${oy} L${ox + 31} ${oy}`, fill: 'none', stroke: C.strip, 'stroke-width': 3, 'stroke-linecap': 'round' }, P);
  const hx = 1490, hy = oy - 25;
  // band
  el('path', { d: `M${hx - 46} ${hy + 10} v-14 a46 46 0 0 1 92 0 v14`, fill: 'none', stroke: C.strip, 'stroke-width': 9, 'stroke-linecap': 'round' }, P);
  // cups
  for (const side of [-1, 1]) {
    el('rect', { x: hx + side * 46 - 13, y: hy + 2, width: 26, height: 46, rx: 11, fill: C.strip }, P);
    el('rect', { x: hx + side * 46 - (side < 0 ? -5 : 13) - 4, y: hy + 10, width: 8, height: 30, rx: 4, fill: C.orange }, P);
  }
  // sound waves
  const waves = el('g', { id: 'waves' }, P);
  for (let i = 0; i < 0; i++) el('path', { d: `M${hx - 20 + i * 0} ${hy + 76 + i * 12} q20 -10 40 0`, fill: 'none', stroke: C.orange, 'stroke-width': 2, 'stroke-linecap': 'round', class: 'wave' }, waves);
  el('text', { x: hx, y: hy + 86, 'text-anchor': 'middle', class: 't-net' }, P, 'One mix');
  el('text', { x: hx, y: hy + 106, 'text-anchor': 'middle', class: 't-small' }, P, 'Headphones or speakers');
}

// ---- features ----
const F = document.getElementById('features');
const feats = [
  { title: 'Highest quality', body: ['Uncompressed 24-bit / 48 kHz by default.', 'CD, Balanced and Saver for busy Wi-Fi.'], icon: 'wave' },
  { title: 'Real time over Wi-Fi', body: ['15–30 ms of buffering. It grows during a', 'Wi-Fi stall and shrinks again after.'], icon: 'clock' },
  { title: 'Private sessions', body: ['Listen privately with a code. Only devices', 'with it can join, and the audio is encrypted.'], icon: 'lock' },
];
feats.forEach((f, i) => {
  const x = 80 + i * 490, y = 716;
  const g = el('g', { filter: 'url(#lift)' }, F);
  el('rect', { x, y, width: 460, height: 132, rx: 16, fill: C.raised, stroke: C.line }, g);
  el('rect', { x: x + 24, y: y + 26, width: 40, height: 40, rx: 10, fill: C.recess }, F);
  const ix = x + 44, iy = y + 46;
  if (f.icon === 'wave') {
    [8, 16, 24, 14, 20, 10, 6].forEach((h, k) => el('rect', { x: ix - 13 + k * 4, y: iy - h / 2, width: 2.4, height: h, rx: 1.2, fill: C.ink }, F));
  } else if (f.icon === 'clock') {
    el('circle', { cx: ix, cy: iy, r: 11, fill: 'none', stroke: C.ink, 'stroke-width': 1.9 }, F);
    el('path', { d: `M${ix} ${iy - 6} v6 l4 3`, fill: 'none', stroke: C.ink, 'stroke-width': 1.9, 'stroke-linecap': 'round' }, F);
  } else {
    lock(F, ix - 7, iy - 10, C.ink);
  }
  el('text', { x: x + 82, y: y + 52, class: 't-feat' }, F, f.title);
  f.body.forEach((line, k) => el('text', { x: x + 82, y: y + 80 + k * 21, class: 't-body' }, F, line));
});

// ---- paths ----
const PA = document.getElementById('paths');
const curves = senders.map((s, i) => {
  const a = [526, s.y + 70], b = [LX - 6, LY + 142 + i * 62 + 30];
  const c1 = [a[0] + 170, a[1]], c2 = [b[0] - 170, b[1]];
  el('path', { d: `M${a} C${c1} ${c2} ${b}`, fill: 'none', stroke: C.strong, 'stroke-width': 2, 'stroke-dasharray': '1 7', 'stroke-linecap': 'round' }, PA);
  return [a, c1, c2, b];
});
function bez([a, c1, c2, b], u) {
  const m = 1 - u;
  const p = (k) => m * m * m * a[k] + 3 * m * m * u * c1[k] + 3 * m * u * u * c2[k] + u * u * u * b[k];
  const d = (k) => 3 * m * m * (c1[k] - a[k]) + 6 * m * u * (c2[k] - c1[k]) + 3 * u * u * (b[k] - c2[k]);
  return [p(0), p(1), Math.atan2(d(1), d(0)) * 180 / Math.PI];
}

// the lost packet sits on the middle path
{
  const [x, y] = bez(curves[1], 0.47);
  document.getElementById("lostmark").setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  document.getElementById("lostlead").setAttribute("d", `M${(x - 14).toFixed(1)} ${(y - 10).toFixed(1)} L700 386`);
}

// ---- moving parts ----
const PK = document.getElementById('packets');
const PER_PATH = 6;
const packets = curves.map((c, i) => Array.from({ length: PER_PATH }, (_, k) => {
  const g = el('g', {}, PK);
  el('rect', { x: -19, y: -7, width: 22, height: 14, rx: 3, fill: C.orange }, g);
  el('rect', { x: -36, y: -7, width: 16, height: 14, rx: 3, fill: C.orange, opacity: 0.35 }, g);
  return g;
}));
const TAU = Math.PI * 2;
function level(t, seed, cycles) {
  // Whole cycles per loop, so frame 0 and the last frame join up.
  const v = 0.55 + 0.25 * Math.sin(TAU * (t * cycles[0] + seed)) + 0.15 * Math.sin(TAU * (t * cycles[1] + seed * 2.3)) + 0.06 * Math.sin(TAU * (t * 9 + seed * 5));
  return Math.max(0, Math.min(1, v));
}
function light(id, v, warm) {
  const dots = document.querySelectorAll(`.grille[data-id="${id}"] circle`);
  const n = Math.round(v * dots.length);
  dots.forEach((d, k) => d.setAttribute('fill', k < n ? (warm && k >= dots.length - 2 ? C.orange : C.strip) : C.hole));
}
function render(t) {
  curves.forEach((c, i) => packets[i].forEach((g, k) => {
    const u = (t * 2 + k / PER_PATH + i * 0.13) % 1;
    const [x, y, ang] = bez(c, u);
    // The packet on the middle path that reaches the red mark is the lost one.
    const lost = i === 1 && k === 0 && u > 0.47;
    g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)})`);
    g.setAttribute('opacity', lost ? 0 : u < 0.06 ? u / 0.06 : u > 0.94 ? (1 - u) / 0.06 : 1);
  }));
  const lv = [level(t, 0.1, [2, 3]), level(t, 0.37, [3, 2]), level(t, 0.71, [1, 4])];
  lv.forEach((v, i) => { light(`s${i}`, v); light(`l${i}`, v * [0.72, 0.8, 0.55][i] + 0.12); });
  light('mix', Math.min(1, (lv[0] * 0.72 + lv[1] * 0.8 + lv[2] * 0.55) / 1.7 + 0.18), true);
  document.querySelectorAll('.onscreen').forEach((w, i) => {
    const x0 = +w.dataset.x, y0 = +w.dataset.y, W = +w.dataset.w;
    let d = '';
    for (let k = 0; k <= 38; k++) {
      const x = x0 + (k / 38) * W;
      const a = 9 * lv[i === 0 ? 0 : 2] * Math.sin(TAU * (k / 38) * 3 + TAU * t * 2 + i) * Math.sin(Math.PI * k / 38);
      d += (k ? 'L' : 'M') + x.toFixed(1) + ' ' + (y0 + a).toFixed(1);
    }
    w.setAttribute('d', d);
  });
  document.querySelectorAll('.progress').forEach((p) => p.setAttribute('width', (8 + 30 * t).toFixed(1)));
  document.querySelectorAll('.wave').forEach((w, k) => w.setAttribute('opacity', (0.25 + 0.75 * (0.5 + 0.5 * Math.sin(TAU * (t * 2 - k * 0.18)))).toFixed(2)));
}
render(0.3);
window.render = render;
</script>
</body>
</html>
