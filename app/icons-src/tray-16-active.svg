<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Hand-fitted 16 px tray icon: 3 px holes on whole pixels, 1 px gaps. -->
  <rect x="0" y="0" width="15" height="15" rx="3" fill="#e3e2e0"/>
  <g fill="#2c2c2c">
    <rect x="2" y="2" width="3" height="3"/><rect x="6" y="2" width="3" height="3"/><rect x="10" y="2" width="3" height="3"/>
    <rect x="2" y="6" width="3" height="3"/><rect x="10" y="6" width="3" height="3"/>
    <rect x="2" y="10" width="3" height="3"/><rect x="6" y="10" width="3" height="3"/><rect x="10" y="10" width="3" height="3"/>
  </g>
  <rect x="6" y="6" width="3" height="3" fill="#e65b0f"/>
</svg>
