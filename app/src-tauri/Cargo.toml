[package]
name = "aonin"
version = "0.1.9"
description = "Highest-quality real-time audio over the local network"
authors = ["Aonin"]
edition = "2024"
license = "GPL-3.0-or-later"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aonin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aon = { version = "0.1.0", path = "../../crates/aon" }
aon-core = { version = "0.1.0", path = "../../crates/aon-core" }
gethostname = "1.1.0"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"


